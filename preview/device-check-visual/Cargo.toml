[package]
name = "device-check-visual"
version = "0.1.0"
edition = "2021"
publish = false
description = "Visual walkthrough of the device check. It does not open USB, MIDI, or audio."

[[bin]]
name = "device-check-visual"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
