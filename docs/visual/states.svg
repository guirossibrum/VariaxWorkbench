<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Original states design proposal</title>
<desc id="desc">Synthetic offline mockup. No working hardware or audio capability implied.</desc>
<style>text{font-family:sans-serif;fill:#ebebeb;font-size:14px}.muted{fill:#c0c0c0}.title{font-size:18px;font-weight:bold}.small{font-size:12px}</style>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#000000" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="60" rx="0" fill="#0f0f0f" stroke="none" stroke-width="2"/>
<text x="16" y="25" class="title">WORKBENCH / RIG</text>
<text x="16" y="46" class="small">ORIGINAL DESIGN STUDY • SYNTHETIC DATA</text>
<text x="300" y="35" class="">Guitar</text>
<text x="380" y="35" class="">POD</text>
<text x="450" y="35" class="">Recording</text>
<text x="560" y="35" class="">Library</text>
<text x="650" y="35" class="">Maintenance</text>
<text x="935" y="35" class="">OFFLINE • HARDWARE LOCKED</text>
<rect x="0" y="62" width="1028" height="46" rx="0" fill="#222222" stroke="none" stroke-width="2"/>
<text x="16" y="91" class="">Local library • No document selected</text>
<rect x="775" y="68" width="100" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="785" y="89" class="">Open file</text>
<rect x="885" y="68" width="125" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="895" y="89" class="">Save copy…</text>
<rect x="1030" y="62" width="248" height="712" rx="6" fill="#0f0f0f" stroke="none" stroke-width="2"/>
<text x="1046" y="88" class="title">LOCAL LIBRARY</text>
<rect x="1046" y="103" width="214" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="1056" y="124" class="">Search local names</text>
<text x="1046" y="180" class="muted">No files loaded</text>
<text x="1046" y="340" class="">Family: PODxt Live</text>
<text x="1046" y="366" class="muted">Local file metadata only</text>
<rect x="1046" y="408" width="212" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="1056" y="429" class="">Read device — locked</text>
<rect x="1046" y="454" width="212" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="1056" y="475" class="">Send to device — locked</text>
<text x="1046" y="514" class="muted">No device access</text>
<text x="1046" y="538" class="muted">No live audio</text>
<text x="1046" y="562" class="small">No cross-family conversion</text>
<rect x="0" y="110" width="1028" height="350" rx="0" fill="#000000" stroke="none" stroke-width="2"/>
<rect x="0" y="464" width="1028" height="310" rx="0" fill="#0f0f0f" stroke="none" stroke-width="2"/>
<text x="24" y="147" class="title">EMPTY LIBRARY</text>
<text x="24" y="184" class="">No local files loaded.</text>
<rect x="24" y="210" width="220" height="32" rx="6" fill="#222222" stroke="#78dce8" stroke-width="2"/>
<text x="34" y="231" class="">Open local file</text>
<text x="24" y="288" class="muted">Focus outline is separate from selection</text>
<text x="24" y="325" class="muted">Tab navigates • Enter opens • Escape returns focus</text>
<rect x="450" y="162" width="548" height="242" rx="6" fill="#222222" stroke="#ff9c9c" stroke-width="2"/>
<text x="470" y="196" class="title">FILE COULD NOT BE OPENED</text>
<text x="470" y="234" class="">Malformed or incomplete document.</text>
<text x="470" y="270" class="muted">Previous document and edits retained.</text>
<rect x="470" y="310" width="180" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="480" y="331" class="">Choose another file</text>
<rect x="670" y="310" width="120" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="680" y="331" class="">Dismiss</text>
<text x="24" y="498" class="title">SAVE COPY / EXISTING DESTINATION</text>
<text x="24" y="538" class="">Destination already exists. Nothing was overwritten.</text>
<text x="24" y="578" class="muted">Unsaved edits and pending action are retained.</text>
<rect x="24" y="608" width="230" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="34" y="629" class="">Choose a new destination</text>
<rect x="274" y="608" width="170" height="32" rx="6" fill="#222222" stroke="#797979" stroke-width="2"/>
<text x="284" y="629" class="">Keep editing</text>
<text x="24" y="703" class="muted">Success appears only after the atomic save completes.</text>
<rect x="0" y="776" width="1280" height="24" rx="0" fill="#222222" stroke="none" stroke-width="2"/>
<text x="12" y="793" class="small">Error needs attention • No file overwritten • No hardware operation attempted</text>
</svg>
