name: Offline core

on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "assets/variax-models/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "requirements.txt"
      - "requirements-tools.json"
      - "research/**"
      - "docs/reproducing-references.md"
      - "scripts/verify_dependency_manifest.py"
      - "scripts/test_dependency_manifest.py"
      - "scripts/dependency_tools.py"
      - "scripts/build_rust_math_reference.py"
      - "scripts/research_setup.py"
      - "scripts/verify_native_startup.py"
      - "scripts/verify_coefficient_jni.py"
      - "scripts/audit_engine_math.py"
      - "scripts/test_research_setup.py"
      - "scripts/rea"
      - "scripts/inspect_firmware.py"
      - "scripts/map_firmware.py"
      - "scripts/test_firmware_map.py"
      - "scripts/native_updater_oracle.py"
      - "scripts/verify_aiff_export.py"
      - "scripts/apple_tiger_math_oracle.py"
      - "scripts/audit_apple_tiger_generator.py"
      - "scripts/audit_apple_tiger_product.py"
      - "scripts/isolate_apple_tiger_case.py"
      - "scripts/audit_apple_tiger_math.py"
      - "scripts/audit_x87_instruction_reference.py"
      - "scripts/extract_apple_tiger_runtime.py"
      - "scripts/native_x87_reference.py"
      - "scripts/verify_apple_tiger_runtime.py"
      - "scripts/x87_instruction_reference.c"
      - "scripts/coefficient_oracle.py"
      - "packaging/**"
      - "scripts/package_linux.py"
      - "scripts/test_linux_package.py"
      - "scripts/verify_linux_package.py"
      - ".github/workflows/offline-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Coefficient math boundary
        run: python scripts/check_coefficient_math.py
      - name: Synthetic research setup guards
        run: python scripts/test_research_setup.py
      - name: Dependency manifest consistency
        run: |
          python scripts/verify_dependency_manifest.py
          python scripts/test_dependency_manifest.py
      - name: Synthetic firmware layout guards
        run: |
          python scripts/inspect_firmware.py --self-test
          python scripts/test_firmware_map.py
          python -m py_compile scripts/native_updater_oracle.py scripts/verify_aiff_export.py scripts/apple_tiger_math_oracle.py scripts/audit_apple_tiger_generator.py scripts/audit_apple_tiger_product.py scripts/isolate_apple_tiger_case.py scripts/audit_apple_tiger_math.py scripts/audit_x87_instruction_reference.py scripts/extract_apple_tiger_runtime.py scripts/native_x87_reference.py scripts/verify_apple_tiger_runtime.py scripts/coefficient_oracle.py scripts/dependency_tools.py scripts/build_rust_math_reference.py scripts/verify_native_startup.py scripts/verify_coefficient_jni.py scripts/audit_engine_math.py
          python -c "import json; json.load(open('research/updater-oracle-reference.json', encoding='utf-8'))"
      - name: Synthetic package guards
        if: runner.os == 'Linux'
        run: python scripts/test_linux_package.py
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - name: Record compiler and math profile
        run: |
          rustc -vV
          cargo run --locked --no-default-features --features portable-math --bin variax-workbench -- math-profile
      - name: Verify bundled Variax data and portable render checksums
        run: cargo run --locked --no-default-features --features portable-math --example verify_variax_models
      # No USB or GUI feature, original library, personal capture, or device API
      # is needed. Preset, DSP, and Variax message fixtures are synthetic.
      # The Variax prefix, variax_startup, and cold-body instructions are
      # committed GPL-2.0-only Linux reference bytes under third_party/.
      # They are test data, not a runtime dependency.
      - name: Debug core and file tests
        run: cargo test --locked --no-default-features --features portable-math
      - name: Release core and file tests
        run: cargo test --locked --release --no-default-features --features portable-math
      - name: Core lint
        run: cargo clippy --locked --no-default-features --features portable-math --all-targets -- -D warnings
