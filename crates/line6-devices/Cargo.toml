[package]
name = "line6-devices"
version = "0.1.0"
edition = "2024"
publish = false
description = "Per-product-family Line 6 device protocols, decoders and gated transports"

[features]
# Live USB interface links (libusb). Off by default: decoders and the ALSA
# MIDI link need no native library.
usb = ["dep:rusb", "dep:macos-usb-inventory"]

[dependencies]
rusb = { version = "=0.9.4", path = "../../third_party/usb/rusb-0.9.4", optional = true }
# Backup manifests. Pure Rust, already used by the main crate (same major version).
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
macos-usb-inventory = { path = "../macos-usb-inventory", optional = true }
rusb = { version = "=0.9.4", path = "../../third_party/usb/rusb-0.9.4", optional = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
macos-usb-inventory = { path = "../macos-usb-inventory" }
