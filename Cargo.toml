[package]
name = "variax-workbench"
version = "0.9.0"
edition = "2024"
default-run = "variax-workbench-gui"
description = "Linux Variax 600 editor investigation and offline protocol tools"
publish = false

[lib]
name = "variax_workbench"

[[bin]]
name = "variax-workbench"
path = "src/main.rs"

[[bin]]
name = "variax-workbench-gui"
path = "app/main.rs"
required-features = ["gui"]

[[bin]]
name = "variax-check"
path = "src/check_app.rs"

[[bin]]
name = "variax-firmware-inspect"
path = "src/firmware_inspect.rs"

[features]
# The app opened from a normal build includes the identity check for any user.
# `gui` alone still does not link USB. Turning default features off leaves step 2 off.
default = ["gui", "usb"]
# Experimental, versioned software mathematics; normal builds retain host math.
portable-math = ["dep:libm"]
gui = ["dep:eframe", "dep:winit", "dep:image", "dep:rfd", "dep:serde", "dep:serde_json"]
# Live USB adapter (rusb/libusb). Separate from `gui`: the `gui` feature never links libusb.
# On Linux, this feature offers the identity check and the step 3 read of both
# families. Step 4 stays off. The editor fetch stays behind the G3 constant.
usb = ["dep:rusb", "dep:line6-devices", "line6-devices/usb"]

[dependencies]
libm = { version = "=0.2.16", optional = true, default-features = false, features = ["force-soft-floats"] }
tempfile = "3"
rusb = { version = "0.9.4", optional = true }
line6-devices = { path = "crates/line6-devices", default-features = false, optional = true }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.18", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
sha2 = "0.10"

[dev-dependencies]
# Already used by the GUI; tests read independent derived oracle references.
# This does not add a JSON dependency to the core application runtime.
serde_json = "1"
# eframe's private screenshot hook (EFRAME_SCREENSHOT_TO) is for test builds only.
# `x11` only gives winit a Linux backend in core-only test builds (X11 is loaded
# at run time, so no system library is needed to build); it is a no-op elsewhere.
eframe = { version = "=0.33.3", default-features = false, features = ["x11", "__screenshot"] }
